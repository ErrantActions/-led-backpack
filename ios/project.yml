name: LEDBackpack
options:
  bundleIdPrefix: com.errantactions
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
packages:
  BackpackProtocol:
    path: Packages/BackpackProtocol
targets:
  LEDBackpack:
    type: application
    platform: iOS
    sources: [LEDBackpack]
    dependencies:
      - package: BackpackProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.errantactions.ledbackpack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: LEDBackpack.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  LEDBackpackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LEDBackpackTests]
    dependencies:
      - target: LEDBackpack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.errantactions.ledbackpack.tests
  LEDBackpackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LEDBackpackUITests]
    dependencies:
      - target: LEDBackpack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.errantactions.ledbackpack.uitests
        TEST_TARGET_NAME: LEDBackpack
schemes:
  LEDBackpack:
    build:
      targets:
        LEDBackpack: all
        LEDBackpackTests: [test]
        LEDBackpackUITests: [test]
    test:
      targets: [LEDBackpackTests, LEDBackpackUITests]
