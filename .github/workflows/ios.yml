name: LED Backpack iOS
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Focused event checks or the full native suite (no upload)
        type: choice
        options: [full, events]
        default: full
  push:
    branches: [main]
    paths: ["ios/LEDBackpack/**", "ios/LEDBackpackTests/**", "ios/LEDBackpackUITests/**", "ios/Packages/**", "ios/project.yml", "ios/Info.plist", "ios/LEDBackpack.entitlements", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/LEDBackpack/**", "ios/LEDBackpackTests/**", "ios/LEDBackpackUITests/**", "ios/Packages/**", "ios/project.yml", "ios/Info.plist", "ios/LEDBackpack.entitlements", ".github/workflows/ios.yml"]
permissions:
  contents: read
concurrency:
  group: led-backpack-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select required Xcode 27.1
        run: |
          XCODE=/Applications/Xcode_27.1.app/Contents/Developer
          test -d "$XCODE" || { echo "::error::This build requires preinstalled Xcode 27.1; no older-toolchain fallback."; exit 1; }
          DEVELOPER_DIR="$XCODE" xcodebuild -version | grep -Fx "Xcode 27.1"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Selected iOS SDK: $SDK"
          python3 -c 'import sys; assert tuple(map(int,sys.argv[1].split(".")[:2])) == (27,1), "This build requires the iOS 27.1 SDK"; print("iOS 27.1 SDK selected; physical Duo fold testing remains separate.")' "$SDK"
      - name: Test portable packet codec
        if: inputs.validation != 'events'
        run: swift test --package-path Packages/BackpackProtocol
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Select iPhone Duo simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[x for runtime,items in d["devices"].items() if runtime.endswith(".iOS-27-1") for x in items if x["name"]=="iPhone Duo"]; assert devices, "The required iOS 27.1 iPhone Duo simulator is unavailable"; print(devices[0]["udid"])')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and test app
        if: inputs.validation != 'events'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Build and verify event flows only
        if: inputs.validation == 'events'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -only-testing:LEDBackpackTests/EventCreationStepsTests \
            -only-testing:LEDBackpackTests/EventBuilderGalleryTests \
            -only-testing:LEDBackpackTests/SocialTabTests \
            -only-testing:LEDBackpackUITests/NavigationTests/testEventInvitationsAreEasyToFindAndCreationStartsWithOnlyEssentials \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/LEDBackpack.app LEDBackpack-simulator.zip
      - name: Export native layout screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/Screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LEDBackpack-iOS-build
          path: |
            ios/LEDBackpack-simulator.zip
            ios/build/TestResults.xcresult
          if-no-files-found: warn
      - name: Upload layout screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LEDBackpack-layouts
          path: ios/build/Screenshots
          if-no-files-found: warn
