name: LED Backpack iOS
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Build only, focused native checks or full suite (no upload)
        type: choice
        options: [full, avatars, performance, processes, live, events, build]
        default: full
  push:
    branches: [main]
    paths: ["ios/LEDBackpack/**", "ios/LEDBackpackTests/**", "ios/LEDBackpackUITests/**", "ios/Packages/**", "ios/project.yml", "ios/Info.plist", "ios/LEDBackpack.entitlements", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/LEDBackpack/**", "ios/LEDBackpackTests/**", "ios/LEDBackpackUITests/**", "ios/Packages/**", "ios/project.yml", "ios/Info.plist", "ios/LEDBackpack.entitlements", ".github/workflows/ios.yml"]
permissions:
  contents: read
concurrency:
  group: led-backpack-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select required Xcode 27.1
        run: |
          XCODE=/Applications/Xcode_27.1.app/Contents/Developer
          test -d "$XCODE" || { echo "::error::This build requires preinstalled Xcode 27.1; no older-toolchain fallback."; exit 1; }
          DEVELOPER_DIR="$XCODE" xcodebuild -version | grep -Fx "Xcode 27.1"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Selected iOS SDK: $SDK"
          python3 -c 'import sys; assert tuple(map(int,sys.argv[1].split(".")[:2])) == (27,1), "This build requires the iOS 27.1 SDK"; print("iOS 27.1 SDK selected; physical Duo fold testing remains separate.")' "$SDK"
      - name: Test portable packet codec
        if: inputs.validation != 'events' && inputs.validation != 'processes' && inputs.validation != 'live' && inputs.validation != 'performance' && inputs.validation != 'avatars' && inputs.validation != 'build'
        run: swift test --package-path Packages/BackpackProtocol
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Select iPhone Duo simulator
        if: inputs.validation != 'build'
        env:
          VALIDATION_MODE: ${{ inputs.validation }}
        run: |
          CONFIG=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devices=[(runtime,x) for runtime,items in d["devices"].items() if runtime.endswith(".iOS-27-1") for x in items if x["name"]=="iPhone Duo"]; assert devices, "The required iOS 27.1 iPhone Duo simulator is unavailable"; runtime,device=devices[0]; print("|".join((device["udid"],device["deviceTypeIdentifier"],runtime)))')
          IFS='|' read -r DEVICE DEVICE_TYPE RUNTIME <<< "$CONFIG"
          if [ "$VALIDATION_MODE" = live ] || [ "$VALIDATION_MODE" = performance ] || [ "$VALIDATION_MODE" = avatars ]; then
            DEVICE=$(xcrun simctl create "LEDBackpack $VALIDATION_MODE $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$DEVICE_TYPE" "$RUNTIME")
            echo "ISOLATED_SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
          fi
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Seed generated avatar photo
        if: inputs.validation == 'avatars'
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data))
          data = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 16, 16, 8, 2, 0, 0, 0))
          data += chunk(b'IDAT', zlib.compress((b'\x00' + b'\x30\xb0\xa0' * 16) * 16)) + chunk(b'IEND', b'')
          Path('build').mkdir(exist_ok=True)
          Path('build/avatar-picker-test.png').write_bytes(data)
          PY
          xcrun simctl addmedia "$SIMULATOR_ID" build/avatar-picker-test.png
      - name: Build and test app
        if: inputs.validation != 'events' && inputs.validation != 'processes' && inputs.validation != 'live' && inputs.validation != 'performance' && inputs.validation != 'avatars' && inputs.validation != 'build'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Build and verify event flows only
        if: inputs.validation == 'events'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -only-testing:LEDBackpackTests/EventCreationStepsTests \
            -only-testing:LEDBackpackTests/EventBuilderGalleryTests \
            -only-testing:LEDBackpackTests/SocialTabTests \
            -only-testing:LEDBackpackUITests/NavigationTests/testEventInvitationsAreEasyToFindAndCreationStartsWithOnlyEssentials \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Build and verify essential process walkthroughs only
        if: inputs.validation == 'processes'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -only-testing:LEDBackpackUITests/NavigationTests/testAppWideProcessesStartWithEssentialsAndKeepSafeExits \
            -only-testing:LEDBackpackUITests/NavigationTests/testWorkflowEndScreensKeepAdvancedControlsCollapsedAndSettingsReachable \
            -only-testing:LEDBackpackUITests/NavigationTests/testLiveMessageSurvivesReflowAndPrimaryControlsRemainReachable \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Verify live reflow only
        if: inputs.validation == 'live'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -only-testing:LEDBackpackUITests/NavigationTests/testLiveMessageSurvivesReflowAndPrimaryControlsRemainReachable \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Verify performance contracts only
        if: inputs.validation == 'performance'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -only-testing:LEDBackpackTests/CatalogMediaPerformanceTests \
            -only-testing:LEDBackpackTests/LibrarySyncPerformanceTests \
            -only-testing:LEDBackpackTests/CommunityChatPerformanceTests \
            -only-testing:LEDBackpackTests/CommunityTests \
            -only-testing:LEDBackpackTests/CloudVaultProtocolTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Verify avatar discovery and photo import only
        if: inputs.validation == 'avatars'
        run: |
          xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -only-testing:LEDBackpackTests/AvatarPhotoImportTests \
            -only-testing:LEDBackpackTests/AIAvatarTests \
            -only-testing:LEDBackpackTests/AccountNativeParityTests/testAvatarCropUploadPreservesAllOriginalGIFBytesAndMetadataOrder \
            -only-testing:LEDBackpackTests/AccountNativeParityTests/testCropRejectsRectangleOutsideSource \
            -only-testing:LEDBackpackTests/AccountNativeParityTests/testCropUsesOrientedRectangleWithoutRotationGuess \
            -only-testing:LEDBackpackUITests/NavigationTests/testProfilePhotoIsVisibleInAccountAndSocialAndUploadsOnlyAfterReview \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Build app only
        if: inputs.validation == 'build'
        run: |
          xcodebuild build -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/LEDBackpack.app LEDBackpack-simulator.zip
      - name: Export native layout screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/Screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LEDBackpack-iOS-build
          path: |
            ios/LEDBackpack-simulator.zip
            ios/build/TestResults.xcresult
          if-no-files-found: warn
      - name: Upload layout screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LEDBackpack-layouts
          path: ios/build/Screenshots
          if-no-files-found: warn
      - name: Remove isolated test simulator
        if: always() && env.ISOLATED_SIMULATOR_ID != ''
        run: |
          STATE=$(xcrun simctl list devices -j | python3 -c 'import json,os,sys; matches=[x for items in json.load(sys.stdin)["devices"].values() for x in items if x["udid"]==os.environ["ISOLATED_SIMULATOR_ID"]]; assert len(matches)==1, "The isolated simulator could not be identified for cleanup"; print(matches[0]["state"])')
          if [ "$STATE" != Shutdown ]; then xcrun simctl shutdown "$ISOLATED_SIMULATOR_ID"; fi
          xcrun simctl delete "$ISOLATED_SIMULATOR_ID"
