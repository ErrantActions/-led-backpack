name: LED Backpack TestFlight
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted runner pool; use the validated pool when ARM capacity is unavailable
        type: choice
        options: [macos-latest, macos-15-intel]
        default: macos-latest
      build_number:
        description: Unused Apple build number for version 0.1.0; increment on each upload
        type: string
        required: true
        default: "1"
      confirm_upload:
        description: Upload a signed build to App Store Connect (no external distribution or App Store submission)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: led-backpack-testflight
  cancel-in-progress: false
jobs:
  verified-ci:
    if: github.ref == 'refs/heads/main' && inputs.confirm_upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reuse passing native validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs | map(select(.event == "push" or .event == "workflow_dispatch")) | .[0].head_sha // empty')
          if [[ ! "$PASSED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No successful native CI run on main. Run LED Backpack iOS first."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$PASSED_SHA"
          if ! git diff --quiet "$PASSED_SHA" "$GITHUB_SHA" -- \
            ios/LEDBackpack ios/LEDBackpackTests ios/Packages ios/project.yml ios/Info.plist .github/workflows/ios.yml; then
            echo "::error::App source or native validation inputs changed. Wait for LED Backpack iOS to pass before uploading."
            exit 1
          fi
          echo "Reusing successful native validation from $PASSED_SHA. No simulator tests repeated." >> "$GITHUB_STEP_SUMMARY"
  internal-upload:
    needs: verified-ci
    environment: testflight
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_NON_EXEMPT_ENCRYPTION }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_DISABLE_COLORS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        run: |
          ruby -c fastlane/Fastfile
          ruby -c fastlane/signing.rb
          ruby -e 'abort("Invalid Apple build number") unless ENV.fetch("BUILD_NUMBER").match?(/\A[1-9]\d{0,3}(?:\.\d{1,2}){0,2}\z/); abort("Review export compliance and configure IOS_NON_EXEMPT_ENCRYPTION as true or false") unless %w[true false].include?(ENV.fetch("NON_EXEMPT_ENCRYPTION"))'
      - name: Select newest installed stable Xcode
        run: |
          XCODE=$(python3 -c 'import pathlib,re; apps=[(tuple(map(int,m.group(1).split("."))),str(p)) for p in pathlib.Path("/Applications").glob("Xcode_*.app") if (m:=re.fullmatch(r"Xcode_(\d+(?:\.\d+){1,2})\.app",p.name))]; assert apps, "No stable Xcode installation found"; print(max(apps)[1]+"/Contents/Developer")')
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
      - name: Show release toolchain
        run: xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Install temporary signing assets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: ruby fastlane/signing.rb
      - name: Archive and upload only
        env:
          IOS_PROJECT_ROOT: ${{ github.workspace }}/ios
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: bundle exec fastlane ios internal_upload
      - name: Remove signing assets
        if: always()
        run: ruby fastlane/signing.rb cleanup
