name: Unsigned native source validation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compile source and optionally run focused units or UI regressions
        type: choice
        options: [focused, compile, gps, ui, library, library-units, connected-device, peer-protocol, ux-endpoints, device-recovery]
        default: focused
        required: true
permissions:
  contents: read
concurrency:
  group: unsigned-native-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-validation:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed Xcode and SDK
        run: |
          XCODE=/Applications/Xcode_27.1.app/Contents/Developer
          test -d "$XCODE" || { echo "::error::Required Xcode 27.1 is not installed on this runner."; exit 1; }
          DEVELOPER_DIR="$XCODE" xcodebuild -version | grep -Fx "Xcode 27.1"
          echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE"
          sw_vers
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "Selected simulator SDK: $SDK"
          test "$SDK" = "27.1" || { echo "::error::Simulator SDK is not 27.1."; exit 1; }
      - name: Generate project with existing tooling
        run: |
          if ! xcodegen --version; then brew install xcodegen; fi
          xcodegen generate
      - name: Verify available simulator
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[x for runtime,items in data["devices"].items() if runtime.endswith(".iOS-27-1") for x in items if x["name"]=="iPhone Duo"]; assert devices, "Required iOS 27.1 iPhone Duo simulator is unavailable"; print(devices[0]["udid"])')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Unsigned compilation and focused tests
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          mkdir -p build
          if [ "$VALIDATION_MODE" = compile ]; then
            xcodebuild build-for-testing -project LEDBackpack.xcodeproj -scheme LEDBackpack \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build/unsigned-validation.log
          else
            TESTS=()
            TIMEOUTS=()
            if [ "$VALIDATION_MODE" = ui ] || [ "$VALIDATION_MODE" = library ]; then
              CLASSES=()
              if [ "$VALIDATION_MODE" = library ]; then
                CLASSES=(CloudSynchronizationTests CloudLibraryTests CloudVaultProtocolTests CloudVaultCryptoTests CloudBackpackSourceTests)
              fi
              TESTS+=("-only-testing:LEDBackpackUITests/NavigationTests")
              TIMEOUTS+=("-test-timeouts-enabled" "YES" "-default-test-execution-time-allowance" "600"
                "-maximum-test-execution-time-allowance" "900")
            elif [ "$VALIDATION_MODE" = device-recovery ]; then
              CLASSES=(DeviceRecoveryTests AccountNativeParityTests ConnectedBackpackTests FriendInviteQRTests MessageIncidentReportTests)
              TESTS+=("-only-testing:LEDBackpackUITests/NavigationTests/testConnectedBackpackRegistrationRequiresSignInBeforeReadingHardware"
                "-only-testing:LEDBackpackUITests/NavigationTests/testConnectedBackpackRegistrationDoesNotScanOrInventIdentityWhileDisconnected")
              TIMEOUTS+=("-test-timeouts-enabled" "YES" "-default-test-execution-time-allowance" "180"
                "-maximum-test-execution-time-allowance" "300")
            elif [ "$VALIDATION_MODE" = ux-endpoints ]; then
              CLASSES=()
              TESTS+=("-only-testing:LEDBackpackUITests/NavigationTests/testWorkflowEndScreensKeepAdvancedControlsCollapsedAndSettingsReachable"
                "-only-testing:LEDBackpackUITests/NavigationTests/testExpandableDetailsButtonsFireOnlyTheChosenAction")
              TIMEOUTS+=("-test-timeouts-enabled" "YES" "-default-test-execution-time-allowance" "180"
                "-maximum-test-execution-time-allowance" "300")
            elif [ "$VALIDATION_MODE" = peer-protocol ]; then
              CLASSES=(PhoneSwapGameTests FriendPlaybackTests LocalPairingTests AutomaticPhoneSessionTests)
            elif [ "$VALIDATION_MODE" = connected-device ]; then
              CLASSES=(ConnectedBackpackTests AccountNativeParityTests BackpackFeatureTests)
              TESTS+=("-only-testing:LEDBackpackUITests/NavigationTests/testConnectedBackpackRegistrationRequiresSignInBeforeReadingHardware"
                "-only-testing:LEDBackpackUITests/NavigationTests/testConnectedBackpackRegistrationDoesNotScanOrInventIdentityWhileDisconnected"
                "-only-testing:LEDBackpackUITests/NavigationTests/testEraseReviewUsesDefaultOffToggleInsteadOfTypingAndStillRequiresConnectedHardware")
              TIMEOUTS+=("-test-timeouts-enabled" "YES" "-default-test-execution-time-allowance" "180"
                "-maximum-test-execution-time-allowance" "300")
            elif [ "$VALIDATION_MODE" = library-units ]; then
              CLASSES=(CloudSynchronizationTests CloudLibraryTests CloudVaultProtocolTests CloudVaultCryptoTests CloudBackpackSourceTests)
            elif [ "$VALIDATION_MODE" = gps ]; then
              CLASSES=(EventSocialSourceTests GPSGameEligibilityTests SoloSourceTests LocalPairingTests)
            else
              CLASSES=(CommunityAdminTests CommunityFeatureTests CommunityChatTests MessageIncidentReportTests)
            fi
            for CLASS in "${CLASSES[@]}"; do
              TESTS+=("-only-testing:LEDBackpackTests/$CLASS")
            done
            xcodebuild test -project LEDBackpack.xcodeproj -scheme LEDBackpack \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              -derivedDataPath build -resultBundlePath build/UnsignedTests.xcresult \
              -parallel-testing-enabled NO "${TESTS[@]}" "${TIMEOUTS[@]}" CODE_SIGNING_ALLOWED=NO | tee build/unsigned-validation.log
          fi
      - name: Verify read-only public integration
        if: inputs.mode == 'ui' || inputs.mode == 'library' || inputs.mode == 'library-units'
        env:
          TEST_RUNNER_NATIVE_PUBLIC_INTEGRATION: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/PublicIntegration.xcresult \
            -only-testing:LEDBackpackTests/NativePublicIntegrationTests \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO | tee build/public-integration.log
      - name: Export UI regression screenshots
        if: always() && (inputs.mode == 'ui' || inputs.mode == 'library' || inputs.mode == 'connected-device' || inputs.mode == 'ux-endpoints')
        run: |
          if test -d build/UnsignedTests.xcresult; then
            xcrun xcresulttool export attachments --path build/UnsignedTests.xcresult \
              --output-path build/UIScreenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.mode == 'ui' || inputs.mode == 'library' || inputs.mode == 'connected-device' || inputs.mode == 'ux-endpoints')
        with:
          name: native-ui-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios/build/UIScreenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-native-validation
          path: |
            ios/build/unsigned-validation.log
            ios/build/UnsignedTests.xcresult
            ios/build/public-integration.log
            ios/build/PublicIntegration.xcresult
          if-no-files-found: warn
