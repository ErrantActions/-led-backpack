name: Consolidated native recovery validation
on:
  workflow_dispatch:
  push:
    branches: [native-recovery]
permissions:
  contents: read
concurrency:
  group: native-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unsigned-recovery:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record committed source and verify Xcode
        run: |
          set -euo pipefail
          mkdir -p build/Recovery
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Ref: $GITHUB_REF"
            echo "Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            test -z "$(git status --porcelain)"
            XCODE=/Applications/Xcode_27.1.app/Contents/Developer
            test -d "$XCODE" || { echo "::error::Required Xcode 27.1 is not installed."; exit 1; }
            export DEVELOPER_DIR="$XCODE"
            echo "DEVELOPER_DIR=$XCODE" >> "$GITHUB_ENV"
            sw_vers
            xcodebuild -version | grep -Fx "Xcode 27.1"
            xcodebuild -version
            swift --version
            xcodebuild -help 2>&1 | grep -E -- 'test-timeouts-enabled|default-test-execution-time-allowance|maximum-test-execution-time-allowance'
            xcodebuild -showsdks
            SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
            echo "Simulator SDK: $SDK"
            test "$SDK" = "27.1" || { echo "::error::Required simulator SDK 27.1 is unavailable."; exit 1; }
          } 2>&1 | tee build/Recovery/provenance.log
      - name: Verify simulator and generate project
        run: |
          set -euo pipefail
          {
            xcrun simctl list devices available
            DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[x for runtime,items in data["devices"].items() if runtime.endswith(".iOS-27-1") for x in items if x["name"]=="iPhone Duo"]; assert devices, "Required iOS 27.1 iPhone Duo simulator is unavailable"; print(devices[0]["udid"])')
            echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
            echo "Selected simulator: $DEVICE"
            if ! xcodegen --version; then brew install xcodegen; fi
            xcodegen generate
          } 2>&1 | tee build/Recovery/project.log
      - name: Test portable protocol
        run: |
          set -euo pipefail
          swift test --package-path Packages/BackpackProtocol 2>&1 | tee build/Recovery/protocol.log
      - name: Compile app and both test bundles unsigned
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Recovery/DerivedData CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/Recovery/compile.log
      - name: Run consolidated source fixture groups
        run: |
          set -euo pipefail
          TESTS=()
          for CLASS in CommunityTests AccountNativeParityTests CatalogManifestTests \
            AdminArtworkTests AutomaticPhoneSessionTests ScopedPhonePreviewTests \
            SoloSourceTests LocalPairingTests FriendArtworkSelectionTests FriendPlaybackTests \
            LocationManagerInitializationTests LocalPixelDocumentTests LocalPixelCodecTests \
            LocalPixelGIFTests LocalPixelStoreTests EventSocialSourceTests \
            OwnerPlaylistSourceTests CommunityChatSourceParityTests; do
            test -f "LEDBackpackTests/$CLASS.swift" || { echo "::error::Required fixture source $CLASS is missing."; exit 1; }
            TESTS+=("-only-testing:LEDBackpackTests/$CLASS")
          done
          xcodebuild test-without-building -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Recovery/DerivedData \
            -resultBundlePath build/Recovery/Focused.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -parallel-testing-enabled NO "${TESTS[@]}" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/Recovery/focused.log
      - name: Run all native unit and UI regressions
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Recovery/DerivedData \
            -resultBundlePath build/Recovery/Integrated.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 900 \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/Recovery/integrated.log
      - name: Verify read-only live public native integration
        env:
          TEST_RUNNER_NATIVE_PUBLIC_INTEGRATION: "1"
        run: |
          set -euo pipefail
          xcodebuild test-without-building -project LEDBackpack.xcodeproj -scheme LEDBackpack \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Recovery/DerivedData \
            -resultBundlePath build/Recovery/PublicIntegration.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -parallel-testing-enabled NO \
            -only-testing:LEDBackpackTests/NativePublicIntegrationTests CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/Recovery/public-integration.log
      - name: Retain source provenance and actual validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios/build/Recovery/*.log
            ios/build/Recovery/Focused.xcresult
            ios/build/Recovery/Integrated.xcresult
            ios/build/Recovery/PublicIntegration.xcresult
          if-no-files-found: warn
